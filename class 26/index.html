<!DOCTYPE html>
<html>
<style>   
html {
        background-color: lightblue;
        color: black;
        font-size: large;
    }
</style> 
<body>
  <h2>JavaScript Class Inheritance project</h2>
  
  <p id="details"></p>
  <script>
    class Drink {
      constructor(producer) {
        this.drinkname = producer;
      }
      present() {
        return 'I have a ' + this.drinkname;
      }
    }
    class Model extends Drink {
      constructor(producer,ing) {
        super(producer);
        this.ingredient = ing;
        
      }
      show() {
        return this.present() + ', it is a ' + this.ingredient;
      }
    }
    let myDrink = new ingredient("Cocacola", "Caffeine");
    document.getElementById("details").innerHTML = myDrink.show();
  </script>
</body>
</html>
